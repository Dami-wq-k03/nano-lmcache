<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root {
  color-scheme: dark;
  --bg: #0b1020; --panel: #121a2e; --panel-2: #0e1628; --line: #263453; --text: #e6edf7; --muted: #9baacc;
  --hit: #36d399; --l2: #93c5fd; --miss: #fb7185; --pending: #fbbf24; --incomplete: #a78bfa;
  --accent: #60a5fa; --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, sans-serif; }
h1 { margin: 0; font-size: 20px; }
h2 { margin: 0 0 4px; font-size: 15px; letter-spacing: .02em; }
.muted { color: var(--muted); }
.note { color: var(--muted); font-size: 12px; margin: 0 0 10px; }
b, .num { font-variant-numeric: tabular-nums; }

header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; padding: 18px 24px 10px; }
.toolbar { position: sticky; top: 0; z-index: 2; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); padding: 10px 24px; }
.toolbar .controls { max-width: 1440px; margin: auto; }

main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 380px); gap: 14px; padding: 14px; max-width: 1440px; margin: auto; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }
.wide { grid-column: 1 / -1; }
@media (max-width: 900px) { main { grid-template-columns: 1fr; } .wide { grid-column: auto; } }

.controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
button { border: 1px solid var(--line); background: #1c2948; color: var(--text); border-radius: 7px; padding: 6px 12px; cursor: pointer; font: inherit; }
button:hover:not(:disabled) { background: #2b3b64; }
button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--accent); border-color: var(--accent); color: #0b1020; font-weight: 600; min-width: 72px; }
button.primary:hover:not(:disabled) { background: #93c5fd; }
#seek { flex: 1; min-width: 160px; accent-color: var(--accent); }
#step-label { font-family: var(--mono); font-size: 12px; min-width: 11ch; text-align: right; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* Overview */
.summary { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.metric { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.metric span { font-size: 12px; }
.metric b { display: block; font-size: 22px; margin-top: 2px; }
.metric.hero b { color: var(--hit); }
.bar { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; background: var(--hit); }
.coverage { margin: 12px 0 0; font-size: 12px; max-width: 110ch; }

/* Chunk states: color is always paired with the status text. */
.legend { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 12px; }
.request { padding: 10px 10px 12px; border-radius: 8px; border-top: 1px solid var(--line); }
.request:first-child { border-top-color: transparent; }
.request.active { background: color-mix(in srgb, var(--accent) 9%, transparent); border-top-color: transparent; }
.request-title { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; overflow-wrap: anywhere; }
.request-title > span { display: flex; align-items: center; gap: 8px; }
.request-title .bar { width: 72px; margin: 0; }
.request-meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
.chunks { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 8px; }
.chunk { padding: 3px 8px; border-radius: 6px; border: 1px solid color-mix(in srgb, currentColor 55%, transparent);
  background: color-mix(in srgb, currentColor 10%, transparent); font: 12px var(--mono); }
.chunk b { opacity: .7; margin-right: 4px; }
.chunk.hit, .chunk.l1_hit { color: var(--hit); }
.chunk.l2_hit { color: var(--l2); }
.chunk.miss { color: var(--miss); }
.chunk.not_checked, .chunk.compute { color: var(--pending); }
.chunk.incomplete { color: var(--incomplete); }
.chunk.active { background: color-mix(in srgb, currentColor 30%, transparent); border-color: currentColor; box-shadow: 0 0 0 2px var(--text); }

/* Prefix tree: drawn at real pixel size and scrolled, never shrunk. */
#tree { overflow: auto; max-height: 420px; background: var(--panel-2); border-radius: 8px; padding: 8px 0; }
#tree svg { display: block; margin: auto; }
.tree-node { fill: #172443; stroke: #7083af; stroke-width: 1.5; }
.tree-node.current { fill: var(--accent); stroke: var(--text); stroke-width: 2.5; }
.tree-edge { stroke: #3f5079; stroke-width: 1.5; fill: none; }
.tree-label { fill: var(--text); font: 9px var(--mono); text-anchor: middle; pointer-events: none; }
.tree-node.current + .tree-label { fill: #0b1020; font-weight: 700; }

/* Timeline: left border encodes the event kind; the type name is always shown. */
#timeline { position: relative; display: flex; flex-direction: column; gap: 4px; max-height: 460px; overflow: auto; padding-right: 4px; }
.event { display: grid; grid-template-columns: 5ch 1fr; gap: 0 10px; padding: 6px 10px; background: var(--panel-2);
  border-left: 3px solid var(--kind, var(--line)); border-radius: 5px; text-align: left; }
.event.current { background: #1a2a4d; border-color: var(--accent); border-left-color: var(--kind, var(--accent)); }
.event .seq { grid-row: span 2; color: var(--muted); font: 12px var(--mono); padding-top: 1px; }
.event-name { font-weight: 600; font-size: 13px; }
.event-name small { color: var(--muted); font-weight: 400; margin-left: 6px; }
.event-detail { color: var(--muted); font: 11px var(--mono); word-break: break-word; }
.kind-hit { --kind: var(--hit); } .kind-miss { --kind: var(--miss); } .kind-store { --kind: var(--l2); } .kind-pending { --kind: var(--pending); }

#detail dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin: 0; font-size: 12px; }
#detail dt { color: var(--muted); }
#detail dd { margin: 0; font-family: var(--mono); overflow-wrap: anywhere; white-space: pre-wrap; }
</style>
</head>
<body>
<header><h1>__TITLE__</h1><div class="muted">Offline replay viewer · no external assets · ←/→ step · Space play</div></header>
<div class="toolbar">
  <div class="controls">
    <button id="reset">Reset</button>
    <button id="prev" aria-label="Previous event">◀ Prev</button>
    <button id="play" class="primary" aria-pressed="false">Play</button>
    <button id="next" aria-label="Next event">Next ▶</button>
    <label for="seek" class="sr-only">Seek event</label><input id="seek" type="range" min="0" value="0">
    <span id="step-label" class="muted" aria-live="polite"></span>
  </div>
</div>
<main>
<section class="panel wide">
  <div id="summary" class="summary"></div>
  <p id="coverage" class="coverage muted"></p>
  <div id="tiers" class="note"></div>
</section>
<section class="panel">
  <h2>Chunks / KV Blocks</h2>
  <div class="legend" aria-label="Chunk state legend">
    <span class="chunk hit">HIT</span><span class="chunk l2_hit">L2_HIT</span><span class="chunk miss">MISS</span>
    <span class="chunk compute">NOT_CHECKED / COMPUTE</span><span class="chunk incomplete">INCOMPLETE</span>
  </div>
  <div class="controls">
    <button id="requests-prev">Earlier requests</button>
    <button id="requests-next">Later requests</button>
    <span id="request-page" class="muted"></span>
  </div>
  <div id="requests"></div>
</section>
<section class="panel">
  <h2>Prefix Tree</h2>
  <p class="note">Relationships in retained events; this is not a live cache snapshot.</p>
  <div id="tree"></div>
  <p id="tree-note" class="note"></p>
</section>
<section class="panel">
  <h2>Request Timeline</h2>
  <p id="timeline-range" class="note"></p>
  <div id="timeline"></div>
</section>
<section class="panel">
  <h2>Event Detail</h2>
  <div id="detail" class="muted"></div>
</section>
</main>
<script>
const DATA = __DATA__;

// Display limits: the summary always covers the full workload; these only
// bound how much retained detail is drawn at once.
const PAGE_SIZE = 25, TIMELINE_WINDOW = 100, MAX_CHUNKS = 200, MAX_TREE_KEYS = 500;
const PLAY_INTERVAL_MS = 700;

const events = DATA.events || [], requests = DATA.requests || [];
const summary = DATA.summary || {}, retention = DATA.retention || {};
const state = { step: -1, page: 0, timer: null };
const $ = id => document.getElementById(id);
const currentEvent = () => (state.step >= 0 ? events[state.step] : null);

const EVENT_LABELS = new Map([
  ["l1_hit", "GPU prefix cache reused"],
  ["l2_lookup", "External cache availability probe"],
  ["l2_hit", "External cache payload found"],
  ["l2_restore", "KV read from external storage"],
  ["gpu_import", "KV copy into engine cache enqueued"],
  ["gpu_export", "KV copy out of engine cache enqueued"],
  ["storage_put", "Write to storage tier"],
  ["eviction", "Remove cached KV"],
  ["promotion", "Copy KV from slow tier to fast tier"],
  ["prefill_step", "Compute uncached prompt tokens"],
]);

function escapeText(value) {
  const map = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
  return String(value ?? "").replace(/[&<>"']/g, char => map[char]);
}

// Coarse kind used only for the timeline's color stripe.
function kindOf(e) {
  const text = `${e.event_type} ${e.result ?? ""}`;
  if (/evict|miss/.test(text)) return "miss";
  if (/hit|restore|import/.test(text)) return "hit";
  if (/put|export|offload|promotion/.test(text)) return "store";
  if (/not_checked|prefill|compute/.test(text)) return "pending";
  return "";
}

const bar = ratio => `<div class="bar"><i style="width:${(Math.min(1, ratio || 0) * 100).toFixed(1)}%"></i></div>`;

// ---- Static sections: rendered once ----

function renderSummary() {
  const counts = summary.event_counts || {};
  if (!summary.event_counts) events.forEach(e => { counts[e.event_type] = (counts[e.event_type] || 0) + 1; });
  const sum = types => types.reduce((n, type) => n + (counts[type] || 0), 0);
  const storageTypes = Object.keys(counts).filter(type => type.startsWith("storage_"));

  const metrics = [
    ["Requests", summary.requests || 0],
    ["Chunks", summary.total_chunks || 0],
    ["Reused", summary.matched_chunks || 0],
    ["Storage events", sum(storageTypes)],
    ["Evictions", sum(["eviction"])],
    ["Tier promotions", sum(["promotion"])],
    ["GPU events", sum(["gpu_export", "cpu_offload", "gpu_import", "l2_restore", "l1_hit", "l2_hit"])],
  ];
  if (summary.l1_hit_blocks !== undefined) {
    metrics.push(["L1 reused blocks", summary.l1_hit_blocks], ["L2 reused blocks", summary.l2_hit_blocks]);
  }
  if (summary.observed_requests) {
    // Keep what the dataset reported apart from what this replay simulated.
    metrics.push(["Dataset-observed cached tokens", summary.observed_cached_tokens || 0],
                 ["Simulated reused tokens", summary.matched_tokens || 0]);
  }
  const hitRate = summary.hit_rate || 0;
  $("summary").innerHTML =
    `<div class="metric hero"><span class="muted">Chunk hit rate</span><b>${(hitRate * 100).toFixed(1)}%</b>${bar(hitRate)}</div>` +
    metrics.map(([label, value]) =>
      `<div class="metric"><span class="muted">${escapeText(label)}</span><b>${escapeText(value)}</b></div>`).join("");

  const partial = retention.events_omitted > 0 || retention.requests_omitted > 0;
  const sampleEvery = retention.sample_every || 1;
  $("coverage").textContent = [
    `Displayed detail: ${requests.length} of ${summary.requests ?? requests.length} requests;`,
    `${events.length} of ${retention.events_total ?? events.length} events.`,
    sampleEvery > 1 ? `One event per ${sampleEvery} observations is selected, starting at sequence 0, until the event limit is reached.` : "",
    partial ? "Some detail is omitted. Summary totals include the full processed workload; the tree and timeline show retained events only."
            : "All processed detail is retained.",
  ].filter(Boolean).join(" ");

  const tiers = Object.entries(summary.storage_hits || {});
  $("tiers").textContent = tiers.length
    ? "Storage reads served: " + tiers.map(([tier, count]) => `${tier}: ${count}`).join(" · ") : "";
}

// The tree layout depends only on retained events, so it is laid out once;
// each step just moves the "current" highlight.
const treeCircles = new Map();
function renderTree() {
  const nodes = new Map();
  for (const e of events) {
    if (!e.key || (!nodes.has(e.key) && nodes.size >= MAX_TREE_KEYS)) continue;
    const previous = nodes.get(e.key);
    nodes.set(e.key, { key: e.key, parent: e.parent_key ?? (previous && previous.parent) });
  }
  const list = [...nodes.values()];
  if (!list.length) { $("tree").innerHTML = '<p class="note" style="text-align:center">No key events retained</p>'; return; }

  const depthOf = node => {
    const seen = new Set([node.key]);
    let level = 0;
    while (node.parent && nodes.has(node.parent) && !seen.has(node.parent)) {
      seen.add(node.parent); node = nodes.get(node.parent); level++;
    }
    return level;
  };
  const rows = [];
  list.forEach(n => { n.depth = depthOf(n); (rows[n.depth] ||= []).push(n); });
  const SPACING_X = 64, SPACING_Y = 62;
  const width = Math.max(260, Math.max(...rows.map(row => row.length)) * SPACING_X);
  const height = rows.length * SPACING_Y + 10;
  rows.forEach(row => row.forEach((n, i) => { n.x = (i + 0.5) * width / row.length; n.y = 34 + n.depth * SPACING_Y; }));

  const edges = list.filter(n => nodes.has(n.parent)).map(n => {
    const p = nodes.get(n.parent), midY = (p.y + n.y) / 2;
    return `<path class="tree-edge" d="M${p.x} ${p.y}C${p.x} ${midY} ${n.x} ${midY} ${n.x} ${n.y}"/>`;
  }).join("");
  const labels = list.map((n, i) =>
    `<g><title>${escapeText(n.key)}</title><circle class="tree-node" data-index="${i}" cx="${n.x}" cy="${n.y}" r="20"/>` +
    `<text class="tree-label" x="${n.x}" y="${n.y + 3}">${escapeText(n.key.slice(0, 6))}</text></g>`).join("");
  $("tree").innerHTML =
    `<svg role="img" aria-label="Prefix relationships from up to ${MAX_TREE_KEYS} keys in retained events" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">${edges}${labels}</svg>`;
  $("tree-note").textContent =
    `${list.length} keys, depth ${rows.length}. Showing up to ${MAX_TREE_KEYS} keys from retained events; missing ancestors may have been omitted. Hover a node for its full key.`;
  document.querySelectorAll("#tree circle").forEach(c => treeCircles.set(list[c.dataset.index].key, c));
}

// ---- Step-dependent sections ----

function renderRequests() {
  const e = currentEvent();
  const start = state.page * PAGE_SIZE, end = Math.min(start + PAGE_SIZE, requests.length);
  $("request-page").textContent = requests.length ? `${start + 1}–${end} of ${requests.length} retained` : "No request detail retained";
  $("requests-prev").disabled = state.page === 0;
  $("requests-next").disabled = end >= requests.length;

  $("requests").innerHTML = requests.slice(start, end).map(r => {
    const isActive = e && e.request_id === r.request_id;
    const activeChunk = isActive ? e.chunk_index : null;
    const statuses = r.statuses || [];
    const chunks = statuses.slice(0, MAX_CHUNKS).map((s, i) =>
      `<span class="chunk ${escapeText(String(s).toLowerCase())}${i === activeChunk ? " active" : ""}"><b>${i}</b>${escapeText(s)}</span>`).join("")
      + (statuses.length > MAX_CHUNKS ? `<span class="muted">Showing the first ${MAX_CHUNKS} of ${statuses.length} chunk states.</span>` : "");
    const meta = [];
    if (r.l1_hit_blocks != null) {
      meta.push(`L1: ${escapeText(r.l1_hit_blocks)} blocks · L2: ${escapeText(r.l2_hit_blocks)} blocks · Prefill computed: ${escapeText(r.computed_tokens)} tokens`);
    }
    if (r.ttft_ms != null) meta.push(`Measured TTFT: ${escapeText(r.ttft_ms.toFixed(1))} ms · includes synchronous L2 writes and tracing`);
    return `<div class="request${isActive ? " active" : ""}"><div class="request-title"><b>${escapeText(r.request_id)}</b>` +
      `<span class="muted num">${escapeText(r.matched_chunks)}/${escapeText(r.total_chunks)} chunks reused ${bar(r.matched_chunks / r.total_chunks)}</span></div>` +
      meta.map(m => `<div class="request-meta">${m}</div>`).join("") +
      `<div class="chunks">${chunks || '<span class="muted">no chunks</span>'}</div></div>`;
  }).join("") || '<p class="muted">Request detail was omitted or the workload is empty. Use the summary totals above.</p>';
}

function renderTimeline() {
  // A sliding window keeps the DOM small and the current event in view.
  const start = Math.max(0, Math.min(state.step - 40, events.length - TIMELINE_WINDOW));
  const end = Math.min(start + TIMELINE_WINDOW, events.length);
  $("timeline-range").textContent = events.length
    ? `Showing retained events ${start + 1}–${end} of ${events.length}. Numbers are original sequence numbers.`
    : "No event detail retained. Summary statistics remain available.";
  $("timeline").innerHTML = events.slice(start, end).map((e, offset) => {
    const i = start + offset, current = i === state.step;
    const detail = [`request=${escapeText(e.request_id)}`];
    if (e.chunk_index != null) detail.push(`chunk=${escapeText(e.chunk_index)}`);
    if (e.result != null) detail.push(escapeText(e.result));
    if (e.metadata && e.metadata.backend) detail.push(`tier=${escapeText(e.metadata.backend)}`);
    const label = EVENT_LABELS.get(e.event_type);
    return `<button type="button" class="event kind-${kindOf(e)}${current ? " current" : ""}" data-index="${i}" aria-pressed="${current}">` +
      `<span class="seq">${escapeText(e.sequence ?? i)}</span>` +
      `<span class="event-name">${escapeText(e.event_type)}${label ? `<small>${escapeText(label)}</small>` : ""}</span>` +
      `<span class="event-detail">${detail.join(" · ")}</span></button>`;
  }).join("");

  // Scroll only the timeline box, never the page.
  const box = $("timeline"), cur = box.querySelector(".current");
  if (cur && (cur.offsetTop < box.scrollTop || cur.offsetTop + cur.offsetHeight > box.scrollTop + box.clientHeight)) {
    box.scrollTop = cur.offsetTop - box.clientHeight / 2;
  }
}

function renderDetail(e) {
  if (!e) { $("detail").textContent = "Press Next, Play, or click an event in the timeline."; return; }
  $("detail").innerHTML = "<dl>" + Object.entries(e).filter(([, v]) => v != null).map(([k, v]) =>
    `<dt>${escapeText(k)}</dt><dd>${escapeText(typeof v === "object" ? JSON.stringify(v, null, 2) : v)}</dd>`).join("") + "</dl>";
}

let highlighted = null;
function render() {
  const e = currentEvent();
  $("step-label").textContent = events.length ? `${state.step + 1} / ${events.length}` : "No events";
  renderDetail(e);
  Object.assign($("seek"), { max: Math.max(0, events.length - 1), value: Math.max(0, state.step), disabled: !events.length });
  $("prev").disabled = state.step < 0;
  $("next").disabled = state.step >= events.length - 1;
  $("play").disabled = !events.length;

  // Follow the current event to the page that shows its request.
  const index = e ? requests.findIndex(r => r.request_id === e.request_id) : -1;
  if (index >= 0) state.page = Math.floor(index / PAGE_SIZE);

  if (highlighted) highlighted.classList.remove("current");
  highlighted = (e && treeCircles.get(e.key)) || null;
  if (highlighted) highlighted.classList.add("current");

  renderRequests();
  renderTimeline();
}

// ---- Controls ----

function goTo(step) {
  state.step = Math.max(-1, Math.min(events.length - 1, step));
  render();
}
function setPlaying(playing) {
  clearInterval(state.timer);
  if (playing && state.step >= events.length - 1) goTo(-1);  // replay from the start
  state.timer = playing ? setInterval(() => {
    if (state.step >= events.length - 1) setPlaying(false); else goTo(state.step + 1);
  }, PLAY_INTERVAL_MS) : null;
  $("play").textContent = playing ? "Pause" : "Play";
  $("play").setAttribute("aria-pressed", String(playing));
}

$("reset").onclick = () => { setPlaying(false); goTo(-1); };
$("prev").onclick = () => goTo(state.step - 1);
$("next").onclick = () => goTo(state.step + 1);
$("play").onclick = () => setPlaying(!state.timer);
$("seek").oninput = () => goTo(Number($("seek").value));
$("timeline").onclick = event => {
  const button = event.target.closest(".event");
  if (button) goTo(Number(button.dataset.index));
};
$("requests-prev").onclick = () => { state.page--; renderRequests(); };
$("requests-next").onclick = () => { state.page++; renderRequests(); };
document.addEventListener("keydown", event => {
  if (event.target.matches("input, textarea")) return;
  if (event.key === "ArrowLeft") goTo(state.step - 1);
  if (event.key === "ArrowRight") goTo(state.step + 1);
  // Space on a focused button already activates that button.
  if (event.key === " " && events.length && !event.target.matches("button")) { event.preventDefault(); setPlaying(!state.timer); }
});

renderSummary();
renderTree();
render();
</script>
</body>
</html>
