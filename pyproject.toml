[project]
name = "nano-lmcache"
version = "0.1.0"
description = "An educational, step-by-step implementation of KV cache reuse"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "kangwenqiao", email = "1124261203@qq.com" }
]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Heavy dependencies stay optional: `uv sync` installs none of them.
# A `vllm` extra is added once a vLLM version is pinned (roadmap V0/V1).
torch = ["torch>=2.4"]
hf = ["torch>=2.4", "transformers>=4.45"]

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "torch: needs PyTorch (skipped when not installed)",
    "gpu: needs PyTorch and a CUDA GPU (skipped otherwise)",
    "vllm: needs vLLM and a CUDA GPU (skipped otherwise)",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
