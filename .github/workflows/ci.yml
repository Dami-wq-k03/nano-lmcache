name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies
        # The nano-vLLM group pulls a large CUDA-only flash-attn wheel. It is
        # not needed by the ordinary lint/type/unit-test job and should not
        # make that job depend on a separate GitHub release asset.
        run: uv sync --locked --no-group nanovllm

      - name: Lint
        run: uv run --locked --no-group nanovllm ruff check .

      - name: Type check
        run: uv run --locked --no-group nanovllm mypy src/nano_lmcache

      - name: Test
        run: uv run --locked --no-group nanovllm pytest

      - name: Install vLLM for connector unit tests
        run: uv pip install --python .venv/bin/python "vllm==0.33.0"

      - name: Test vLLM connector unit tests
        run: .venv/bin/python -m pytest -q tests/unit/test_nano_lmcache_connector.py

  tensor-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install CPU tensor test dependencies
        # Keep the CPU tensor group, but do not resolve the unrelated
        # nano-vLLM/flash-attn integration dependencies on this runner.
        run: uv sync --locked --group tensor-test --no-group nanovllm

      - name: Test CPU tensor and Hugging Face support
        run: uv run --locked --group tensor-test --no-group nanovllm pytest -m "torch and not gpu"
